name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: python -m pip install -e ".[dev,api,stream]"
      - name: Validate repository contracts
        run: python scripts/validate_repository.py
      - name: Verify generated skill index and catalogue
        run: |
          python scripts/build_skill_index.py --check
          python scripts/build_skill_catalog.py --check
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Static security scan
        run: bandit -q -r src/marketcouncil
      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable
      - name: Build and verify wheel
        run: |
          python -m build
          python -m pip install --no-deps --target /tmp/marketcouncil-wheel dist/*.whl
          PYTHONPATH=/tmp/marketcouncil-wheel python -m marketcouncil skills validate
          PYTHONPATH=/tmp/marketcouncil-wheel python -m marketcouncil workflows validate
      - name: Offline multi-agent demo
        run: market-council demo --format json > /tmp/marketcouncil-demo.json
      - name: Assert review and execution boundaries
        run: python -c "import json; d=json.load(open('/tmp/marketcouncil-demo.json')); assert len(d['agents']) == 15; assert d['execution_authorization'] == 'NONE'; assert d['review_status'] == 'HUMAN_REVIEW_REQUIRED'"
